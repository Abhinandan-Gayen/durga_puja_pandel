publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: ^3.4.1
  cloud_firestore: ^6.1.3
  file_picker: ^10.3.7
  firebase_auth: ^6.2.0
  firebase_core: ^4.5.0
  geocoding: ^3.0.0
  geolocator: ^14.0.2
